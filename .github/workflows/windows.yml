name: Windows CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows-pytest:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke test (headless autopilot)
        run: python trade_main.py
        env:
          TRADE_HEADLESS: "1"
          PYTHONUNBUFFERED: "1"

          
